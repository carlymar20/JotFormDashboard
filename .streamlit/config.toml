# Streamlit theme for the JotForm Compliance Dashboard.
#
# primaryColor replaces Streamlit's default red everywhere the app uses its
# accent color: multiselect tags, the selected tab, checkboxes, the date
# picker, and the outline on a focused input. It's Evolution teal, the same
# value as BRAND["teal"] in main.py.
#
# Having both [theme.light] and [theme.dark] sections is what gives viewers
# the System / Light / Dark choice in the app's settings menu (System follows
# their computer). Each section only needs what differs from [theme]; the
# light and dark versions of the custom brand colors live in main.py
# (BRAND and BRAND_DARK).

[theme]
primaryColor = "#00C0B5"

[theme.light]
primaryColor = "#00C0B5"

[theme.dark]
primaryColor = "#00C0B5"
